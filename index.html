<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recon Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0b0e14; color:#e6e6e6; margin:0; padding:16px; }
  h1 { font-size:1.2rem; margin:0 0 16px; }
  .crumbs { font-size:.85rem; color:#8a93a6; margin-bottom:12px; }
  .crumbs a { color:#7aa2f7; text-decoration:none; cursor:pointer; }
  .card { background:#131722; border:1px solid #222838; border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .card:hover { border-color:#3b4261; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .name { font-weight:600; }
  .meta { font-size:.8rem; color:#8a93a6; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem; margin-left:6px; }
  .high { background:#3a1620; color:#ff6b7a; }
  .medium { background:#3a2f16; color:#ffb454; }
  .low { background:#16261a; color:#7ee787; }
  .changed { background:#16233a; color:#79b8ff; }
  ul.hosts { list-style:none; padding:0; margin:8px 0 0; font-size:.85rem; }
  ul.hosts li { padding:4px 0; border-top:1px solid #1d2233; word-break:break-all; }
  .empty { color:#8a93a6; text-align:center; padding:40px 0; }
  .refresh { float:right; font-size:.8rem; color:#7aa2f7; cursor:pointer; }
</style>
</head>
<body>
<h1 id="title">Recon Dashboard</h1>
<div class="crumbs" id="crumbs"></div>
<div id="content"><div class="empty">Loading…</div></div>

<script>
const content = document.getElementById('content');
const crumbs = document.getElementById('crumbs');
const title = document.getElementById('title');

async function getJSON(path) {
  const r = await fetch(path + '?_=' + Date.now());
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function setCrumbs(parts) {
  crumbs.innerHTML = parts.map((p, i) =>
    i === parts.length - 1 ? `<span>${p.label}</span>` : `<a onclick="${p.onclick}">${p.label}</a> / `
  ).join('');
}

async function showPrograms() {
  title.textContent = 'Recon Dashboard';
  setCrumbs([{ label: 'Programs' }]);
  try {
    const index = await getJSON('programs/index.json');
    if (!index.length) { content.innerHTML = '<div class="empty">No programs scanned yet.</div>'; return; }
    index.sort((a, b) => new Date(b.last_scan) - new Date(a.last_scan));
    content.innerHTML = index.map(p => `
      <div class="card" onclick="showHistory('${p.name}')">
        <div class="row">
          <span class="name">${p.name}</span>
          <span class="meta">${p.total} assets</span>
        </div>
        <div class="meta">last scan: ${fmtDate(p.last_scan)}</div>
      </div>`).join('');
  } catch (e) {
    content.innerHTML = `<div class="empty">No scans yet, or programs/index.json not found.</div>`;
  }
}

async function showHistory(program) {
  title.textContent = program;
  setCrumbs([{ label: 'Programs', onclick: 'showPrograms()' }, { label: program }]);
  const history = await getJSON(`programs/${program}/history.json`);
  history.sort((a, b) => new Date(b.date) - new Date(a.date));
  content.innerHTML = history.map((h, i) => `
    <div class="card" onclick="toggleDetail(this)">
      <div class="row">
        <span class="name">${fmtDate(h.date)}</span>
        <span class="meta">${h.total} total</span>
      </div>
      <div class="meta">
        ${h.new_count ? `<span class="badge high">${h.new_count} new</span>` : ''}
        ${h.changed_count ? `<span class="badge changed">${h.changed_count} changed</span>` : ''}
        ${!h.new_count && !h.changed_count ? 'no change' : ''}
      </div>
      <ul class="hosts" style="display:none">
        ${(h.new || []).map(host => `<li>+ ${host}</li>`).join('')}
        ${(h.changed || []).map(host => `<li>~ ${host}</li>`).join('')}
      </ul>
    </div>`).join('');
}

function toggleDetail(card) {
  const ul = card.querySelector('ul');
  if (ul) ul.style.display = ul.style.display === 'none' ? 'block' : 'none';
}

showPrograms();
</script>
</body>
</html>
