name: recon

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      domain:
        description: "Add/scan one domain now (blank = scan every domain in targets.txt)"
        required: false

permissions:
  contents: write

concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/tomnomnom/assetfinder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pip install -r requirements.txt

      - name: Add domain to targets.txt if given
        if: ${{ inputs.domain != '' }}
        run: |
          grep -qxF "${{ inputs.domain }}" targets.txt 2>/dev/null || echo "${{ inputs.domain }}" >> targets.txt
          sort -u -o targets.txt targets.txt

      - name: Run pipeline
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.domain }}" ]; then
            python3 scripts/pipeline.py "${{ inputs.domain }}"
          else
            grep -vE '^\s*(#|$)' targets.txt | while read -r d; do
              python3 scripts/pipeline.py "$d" || echo "pipeline failed for $d"
            done
          fi

      - name: Save state
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add programs targets.txt
          git diff --cached --quiet || (git commit -m "recon state update" && git push)
