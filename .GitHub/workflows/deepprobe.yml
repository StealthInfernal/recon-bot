name: deep-probe

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Comma or newline separated hosts to probe deeper"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run deep probe
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scripts/deep_probe.py "${{ inputs.hosts }}"
